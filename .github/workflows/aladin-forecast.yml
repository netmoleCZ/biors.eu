name: ALADIN Forecast Pre-processor

on:
  schedule:
    # 30 minutes after each ALADIN run (00Z, 06Z, 12Z, 18Z)
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # Check out the branch that contains the script (master / default branch).
      # The generated chmi_forecast.json is then pushed to aladin-data separately.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install eccodes numpy scipy requests

      - name: Run ALADIN pre-processor
        run: python .github/scripts/fetch_aladin.py

      - name: Publish chmi_forecast.json to aladin-data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save generated file before switching branches
          cp chmi_forecast.json /tmp/chmi_forecast.json
          rm chmi_forecast.json

          # Switch to or create the aladin-data branch
          if git fetch origin aladin-data 2>/dev/null; then
            git checkout aladin-data
          else
            git checkout --orphan aladin-data
            git rm -rf . --quiet 2>/dev/null || true
          fi

          cp /tmp/chmi_forecast.json chmi_forecast.json
          git add chmi_forecast.json
          git diff --cached --quiet && echo "No changes, skipping commit" && exit 0
          git commit -m "Update ALADIN forecast $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin aladin-data
